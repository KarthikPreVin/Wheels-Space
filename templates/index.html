<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginPage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/Login_style.css">

    <style>
        html,body{
            height: 100%;
            width : 100%;
            align-content: center;
            overflow: hidden;
        }
        .appLabel{
            display: block;
            text-align: center;
            font-weight: bold;
            text-shadow: 0px 0px 100px #9B4DFF;
        }

    </style>
</head>
<body>

    <div id="loginBox">
        <form action="/submitlogin" id="loginForm" method="POST">
            <h1 class="mb-5 appLabel">WHEELS' SPACE</h1>
            <h2 class="mb-4 appLabel">Login</h2>
            <div class="mb-2">
                <input class = "form-control inputElt" type="email" name="email" id="email" placeholder="Email">
            </div>
            <div class="mb-3">
                <input class = "form-control inputElt" type="password" name ="password" id="password" placeholder="Password">
            </div>
            <div class="mb-3" style = "display: flex; justify-content: space-evenly;">
                <input class = "btn buttonStyle col-4" type="submit" value="Login" id="submit">
                <a class = "buttonStyle btn col-4" href="{{url_for('auth_rbac.signup')}}"> Sign Up</a>
            </div>
        </form>
    </div>
    
</body>
</html>
