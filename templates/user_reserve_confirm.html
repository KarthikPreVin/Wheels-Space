<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/General_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/User_style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark my-nav-bar">
        <div class="navbar-brand logo">
            <img src="{{ url_for('static', filename='images/logo.png' )}}" alt="LOGO" id="logo" class="img-fluid mb-5">
        </div>
        <div>
            <div class="fw-bold text-white">Wheel's Space</div>
            <div class="fw-bold text-white"> Hello, {{user.name}}</div>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarelements">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarelements">
            <div class="vr mx-3 d-none d-lg-block" style = "height: 60px; width: 1px; background-color: white;"></div>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a href="{{url_for('user_routes.home', user_id = user.user_id)}}" class="nav-link my-nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{{url_for('user_routes.summary', user_id = user.user_id)}}" class="nav-link my-nav-link">Summary</a>
                </li>
            </ul>
            <div class="hr d-lg-none d-block mx-2" style = "height: 1px; width: auto; background-color: white;"></div>
            <ul class="navbar-nav">
                 <li class="nav-item">
                    <a href="{{url_for('user_routes.useredit', user_id = user.user_id)}}" class="nav-link my-nav-link">Edit Profile</a>
                </li>
                <li class="nav-item">
                    <a href="{{url_for('auth_rbac.logout')}}" class="nav-link my-nav-link text-danger">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="span-box container d-flex justify-content-center">
        <div class="green-box">
            <h2 class="row m-2 my-title justify-content-center fw-bold h5">
                CONFIRM BOOKING
            </h2>
            <div class="row mb-1 px-2">
                <div class="col my-label">LOT ID</div>
                <div class="col my-value view-highlight">{{lot.lot_id}}</div>
            </div>
            
            <div class="row mb-1 px-2">
                <div class="col my-label">RATE</div>
                <div class="col my-value view-highlight">{{lot.price}}</div>
            </div>
            <p>CONFIRM BOOKING OF SPOT IN PARKING LOT AT {{lot.address}}, {{lot.location}}?</p>
            <div class="row justify-content-center">
                <form class = "col-8 text-center p-0" action="{{url_for('user_routes.reservespot',user_id = user.user_id, lot_id = lot.lot_id)}}" method="POST">
                    <input class="p-1 rounded" type="text" name="vehicle" id="vehicle" placeholder="Enter Vehicle Number">
                    <input type="submit" value="BOOK" class="user-btn w-10 add-btn">
                </form>
            </div>
            <div class="row justify-content-center">
                <a href="{{url_for('user_routes.home',user_id = user.user_id)}}" class="user-btn col-4 edit-btn">BACK</a>
            </div>
        </div>
    </div>
    
</body>
</html>
