<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreateAccountPage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/Login_style.css">

    <style>
        html,body{
            height: 100%;
            width : 100%;
            align-content: center;
            overflow: hidden;
        }
        .appLabel{
            display: block;
            text-align: center;
            font-weight: bold;
            text-shadow: 0px 0px 100px #9B4DFF;
            /* min-width: 300px; */
        }

    </style>
</head>
<body>

    <div id="loginBox">
        <div class="alert alert-danger" {% if hide_alert %}style="display: none;"{% endif %} role="alert">
            {{ alert_text }}
        </div>
        <form action="/signup" id="loginForm" method="POST">
        <h1 class="mb-4 appLabel">Create Account</h1>
        <div class="mb-2">
            <input class = "form-control inputElt" type="email" name="email" id="email" placeholder="Email">
        </div>
        <div class="mb-2">
            <input class = "form-control inputElt" type="password" name ="password" id="password" placeholder="Password">
        </div>
        <div class="mb-2">
            <input class = "form-control inputElt" type="text" name ="fullname" id="fullname" placeholder="Full Name">
        </div>
        <div class="mb-2">
            <textarea name="address" id="address" placeholder="Address" rows="2" class="col-12 form-control inputElt"></textarea>
        </div>
        <div class="mb-3">
            <input class = "form-control inputElt" type="number" name ="pincode" id="pincode" placeholder="Pincode">
        </div>
        <div class="mb-2" style = "display: flex; justify-content: space-evenly;">
            <input class = "btn buttonStyle col-6" type="submit" min="0" max="999999" value="Create Account" id="submit">
        </div>
    </form>
    </div>
    
</body>
</html>
