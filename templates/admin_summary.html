<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminPage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/General_style.css">
    <link rel="stylesheet" href="../static/css/Admin_style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark my-nav-bar">
        <div class="navbar-brand logo">
            <img src = "{{ url_for('static', filename='images/logo.png')}}" alt="WHEEL'S SPACE LOGO" id="logo" class="img-fluid mb-5">
        </div>
        <span class="fw-bold text-white">Wheel's Space</span>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarelements">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id = "navbarelements">
            <div class="vr mx-3 d-none d-lg-block bg-light" style="height: 60px; width: 1px;"></div>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a href="{{url_for("admin_routes.adminhome")}}" class="nav-link my-nav-link">Home</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for("admin_routes.adminusers")}}" class="nav-link my-nav-link">Users</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for("admin_routes.adminsearch")}}" class="nav-link my-nav-link">Search</a> 
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link my-nav-link active">Summary</a> 
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="{{url_for("admin_routes.adminedit")}}" class="nav-link my-nav-link">Edit Profile</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('auth_rbac.logout')}}" class="nav-link my-nav-link text-danger">Logout</a> 
                </li>
            </ul>
        </div>
    </nav>
    <div class="container-fluid py-4 admin-page-box">
        <div class="row justify-content-center mb-4">
            <a href="{{url_for('admin_routes.adminhistory')}}" class="admin-button col-11 col-sm-6 col-md-4 col-xl-3 edit-btn">VIEW USER RESERVATION LOG</a>
        </div>
    </div>
    <div class="container-fluid row d-flex justify-content-center">
        <div class="chart col-11 col-md-5">
            <canvas id="chart1" width="600" height="600"></canvas>
        </div>
        <div class="chart col-11 col-md-5">
            <canvas id="chart2" width="600" height="600"></canvas>
        </div>
    </div>

    {% set x1 = data1.keys() | list %}
    {% set y1 = data1.values() | list %}

    {% set x2 = data2.keys() | list | tojson%}
    {% set y2 = data2.values() | list %}


    {{x1}}
    {{y1}}
    {{x2}}
    {{y2}}
    <script>
        const chart1 = document.getElementById("chart1");
        const chart2 = document.getElementById("chart2");
        function concatlot(num){
            return `LOT ${num}`
        }
        new Chart(chart1,{
            type: 'bar',
            data: {
                labels: {{x1}}.map(concatlot) ,
                datasets: [{
                    label: '# of reservations',
                    data: {{y1}},
                    borderWidth: 1
                }],
            },
            options:  {
                scales: {
                    y: {
                        beginsAtZero: true
                    }
                }
            }
        });

        new Chart(chart2,{
            type: 'bar',
            data: {
                labels: {{x2}} ,
                datasets: [{
                    label: '# of reservations',
                    data: {{y2}},
                    borderWidth: 1
                }],
            },
            options:  {
                scales: {
                    y: {
                        beginsAtZero: true
                    }
                }
            }
        });
    </script>

</body>
</html>
