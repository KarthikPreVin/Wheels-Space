<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/General_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/User_style.css') }}">
    <link rel="stylesheet" href="../static/css/User_style.css">
    <link rel="stylesheet" href="../static/css/General_style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark my-nav-bar">
        <div class="navbar-brand logo">
            <img src="{{ url_for('static', filename='images/logo.png' )}}" alt="LOGO" id="logo" class="img-fluid mb-5">
        </div>
        <div>
            <div class="fw-bold text-white">Wheel's Space</div>
            <div class="fw-bold text-white"> Hello, {{user.name}}</div>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarelements">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarelements">
            <div class="vr mx-3 d-none d-lg-block" style = "height: 60px; width: 1px; background-color: white;"></div>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a href="{{url_for('user_routes.home',user_id = user.user_id)}}" class="nav-link my-nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{{url_for('user_routes.summary',user_id = user.user_id)}}" class="nav-link my-nav-link">Summary</a>
                </li>
            </ul>
            <div class="hr d-lg-none d-block mx-2" style = "height: 1px; width: auto; background-color: white;"></div>
            <ul class="navbar-nav">
                 <li class="nav-item">
                    <a href="#" class="nav-link my-nav-link active">Edit Profile</a>
                </li>
                <li class="nav-item">
                    <a href="{{url_for('auth_rbac.logout')}}" class="nav-link my-nav-link text-danger">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="span-box text-center container">
        <div class="row  mb-4 py-2 justify-content-center">
            <div class="view-highlight h2 col-10">EDIT PARKING LOT</div>
        </div>

        <div class="alert m-2 {% if bad_alert %} alert-danger {% else %} alert-success {% endif %}" {% if hide_alert %}style="display: none;"{% endif %} role="alert">
            {{ alert_text }}
        </div>
        <div class="col-12 mb-2 px-5 view-highlight" style="box-shadow: none;">USER-ID #{{user.user_id}}</div>
        <div class="col-12 mb-2 text-break view-highlight" style="box-shadow: none;">Email: {{user.email}}</div>
        
        <form class="form-style form my-form" action="{{ url_for('user_routes.useredit', user_id = user.user_id) }}" method="POST">
            <div class="mb-2 d-flex">
                <label for="password" class="form-label col-5">Password</label>
                <input class="form-control my-form-input" type="password" name="password" placeholder="new Password" id="password" value="">
            </div>
            <div class="mb-2 d-flex">
                <label for="fullname" class="form-label col-5">Full Name</label>
                <input class="form-control my-form-input" type="text" name="fullname" id="fullname" value="{{user.name}}">
            </div>
            <div class="mb-2 d-flex">
                <label for="address" class="form-label col-5">Address</label>
                <textarea name="address" id="address" rows="2" class="form-control my-form-input">{{user.address}}</textarea>
            </div>
            <div class="mb-3 d-flex">
                <label for="pincode" class="form-label col-5">Pincode</label>
                <input class="form-control my-form-input" type="number" name="pincode" id="pincode" value="{{user.pincode}}" min="0" max="999999">
            </div>

            <div class="mb-2 d-flex justify-content-center">
                <input class="user-btn add-btn col-4" type="submit" value="UPDATE" id="submit">
                <a href="{{ url_for('user_routes.home',user_id = user.user_id) }}" class="user-btn edit-btn col-4">BACK</a>
            </div>
        </form>
    </div>
</body>
</html>
