<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/Admin_style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark my-nav-bar">
        <div class="navbar-brand logo">
            <img src = "{{url_for('static', filename='images/logo.png')}}" alt="WHEEL'S SPACE LOGO" id="logo" class="img-fluid mb-5">
        </div>
        <span class="fw-bold text-white">Wheel's Space</span>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarelements">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id = "navbarelements">
            <div class="vr mx-3 d-none d-lg-block bg-light" style="height: 60px; width: 1px;"></div>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminhome')}}" class="nav-link my-nav-link">Home</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminusers')}}" class="nav-link my-nav-link">Users</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminsearch')}}" class="nav-link my-nav-link">Search</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminsummary')}}" class="nav-link my-nav-link">Summary</a> 
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminedit')}}" class="nav-link my-nav-link">Edit Profile</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('auth_rbac.logout')}}" class="nav-link my-nav-link text-danger">Logout</a> 
                </li>
            </ul>
        </div>
    </nav>

    <div class="span-box container">
        <div class="row  mb-4 py-2 justify-content-center">
            <div class="view-highlight h2 col-10">ADD PARKING LOT</div>
        </div>

        <div class="alert {% if bad_alert %} alert-danger {% else %} alert-success {% endif %}" {% if hide_alert %}style="display: none;"{% endif %} role="alert">
            {{ alert_text }}
        </div>

        <form class="form-style form my-form" action="{{ url_for('admin_routes.addlot') }}" method="POST">
            <div class="mb-2 d-flex">
                <label for="location" class="form-label col-4">Location</label>
                <input class="form-control my-form-input" type="text" name="location" id="location">
            </div>
            <div class="mb-2 d-flex">
                <label for="address" class="form-label col-4">Address</label>
                <textarea name="address" id="address" rows="2" class="form-control my-form-input"></textarea>
            </div>
            <div class="mb-2 d-flex">
                <label for="pincode" class="form-label col-4">Pincode</label>
                <input class="form-control my-form-input" type="number" name="pincode" id="pincode" min="0" max="999999">
            </div>
            <div class="mb-2 d-flex">
                <label for="rate-per-hour" class="form-label col-4">Rate Per Hour</label>
                <input class="form-control my-form-input" type="number" name="rate-per-hour" id="rate-per-hour">
            </div>
            <div class="mb-3 d-flex">
                <label for="max-spots" class="form-label col-4">Max Spots</label>
                <input class="form-control my-form-input" type="number" name="max-spots" id="max-spots">
            </div>

            <div class="mb-2 d-flex justify-content-center">
                <input class="admin-button add-btn col-4" type="submit" value="ADD" id="submit">
                <a href="{{ url_for('admin_routes.adminhome') }}" class="admin-button edit-btn col-4">BACK</a>
            </div>
        </form>
    </div>
    


</body>
</html>
