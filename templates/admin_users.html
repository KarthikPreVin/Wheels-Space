<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminPage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/General_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Admin_style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark my-nav-bar">
        <div class="navbar-brand logo">
            <img src = "{{ url_for('static', filename='images/logo.png')}}" alt="WHEEL'S SPACE LOGO" id="logo" class="img-fluid mb-5">
        </div>
        <span class="fw-bold text-white">Wheel's Space</span>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarelements">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id = "navbarelements">
            <div class="vr mx-3 d-none d-lg-block bg-light" style="height: 60px; width: 1px;"></div>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminhome')}}" class="nav-link my-nav-link">Home</a> 
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link my-nav-link active">Users</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminsearch')}}" class="nav-link my-nav-link">Search</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminsummary')}}" class="nav-link my-nav-link">Summary</a> 
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="{{url_for('admin_routes.adminedit')}}" class="nav-link my-nav-link">Edit Profile</a> 
                </li>
                <li class="nav-item">
                    <a href="{{url_for('auth_rbac.logout')}}" class="nav-link my-nav-link text-danger">Logout</a> 
                </li>
            </ul>
        </div>
    </nav>
    <div class="container-fluid admin-page-box">
        <h1 class="text-center mx-5 my-5 my-title">REGISTERED USERS</h1>
        <div class="container-fluid border user-box" style="max-width: 1400px; width: 95%;">
            <div class="row">
                <div class="col-1 text-break border user-details admin-text" style="height: 2.2em !important; font-weight: bold; font-size: larger;">ID</div>
                <div class="col-3 text-break border user-details admin-text" style="height: 2.2em !important; font-weight: bold; font-size: larger;">EMAIL</div>
                <div class="col-3 text-break border user-details admin-text" style="height: 2.2em !important; font-weight: bold; font-size: larger;">NAME</div>
                <div class="col-4 text-break border user-details admin-text" style="height: 2.2em !important; font-weight: bold; font-size: larger;">ADDRESS</div>
                <div class="col-1 text-break border user-details admin-text" style="height: 2.2em !important; font-weight: bold; font-size: larger;">PINCODE</div>
            </div>
            {% for user in all_users %}
            <div class="row">
                <div class="col-1 text-break user-details border-bottom border-start fs-5" style="border-color: #9b4dff50 !important;">{{user.user_id}}</div>
                <div class="col-3 text-break user-details border-bottom border-start fs-5" style="border-color: #9b4dff50 !important;">{{user.email}}</div>
                <div class="col-3 text-break user-details border-bottom border-start fs-5" style="border-color: #9b4dff50 !important;">{{user.name}}</div>
                <div class="col-4 text-break user-details border-bottom border-start fs-5" style="border-color: #9b4dff50 !important;">{{user.address}}</div>
                <div class="col-1 text-break user-details border-bottom border-start border-end fs-5" style="border-color: #9b4dff50 !important;">{{user.pincode}}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
